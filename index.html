<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Challenge Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <h1>🧠 Memory Challenge</h1>
        <p class="subtitle">Remember the sequence. Beat your best score!</p>

        <div class="stats">
            <div class="stat-box">
                <span>LEVEL</span>
                <strong id="level">1</strong>
            </div>

            <div class="stat-box">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>
        </div>

        <p id="message" aria-live="polite">
            Press Start Game to begin!
        </p>

        <div id="sequence" class="sequence"></div>

        <div id="answerArea" class="answer-area hidden">
            <label for="answer">Enter the sequence in order:</label>
            <input
                type="text"
                id="answer"
                inputmode="numeric"
